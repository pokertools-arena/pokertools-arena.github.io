name: Real-API diagnostics (manual)

# Requires repository secrets and is triggered manually (or from a release) so
# ordinary CI stays offline and credential-free. When the OPENAI_* secrets are
# not configured the diagnostics job is skipped with a notice instead of
# failing, so publishing a release never leaves a red run behind.
on:
  workflow_dispatch:
    inputs:
      reps:
        description: Repetitions per cell
        default: '10'
      cap:
        description: Hard cap on decisions
        default: '600'
      fragmentation:
        description: Run the A/B/C/D fragmentation experiment
        type: boolean
        default: true
  release:
    types: [published]

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Check for real-API credentials
        id: check
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_PLAYER1: ${{ secrets.OPENAI_PLAYER1 }}
        run: |
          if [ -n "$OPENAI_API_KEY" ] && [ -n "$OPENAI_PLAYER1" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Real-API credentials found; running diagnostics."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Real-API diagnostics skipped::Set the OPENAI_API_KEY and OPENAI_PLAYER1 repository secrets to run the real-API diagnostics."
          fi

  diagnostics:
    needs: preflight
    if: needs.preflight.outputs.configured == 'true'
    runs-on: ubuntu-latest
    env:
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_PLAYER1: ${{ secrets.OPENAI_PLAYER1 }}
      OPENAI_PLAYER2: ${{ secrets.OPENAI_PLAYER2 }}
      OPENAI_PLAYER3: ${{ secrets.OPENAI_PLAYER3 }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install
      - name: Paired fixed-state corpus
        run: |
          EXTRA=""
          if [ "${{ github.event.inputs.fragmentation }}" != "false" ]; then EXTRA="--fragmentation"; fi
          node tests/real/real-paired-corpus.mjs \
            --reps ${{ github.event.inputs.reps || 10 }} \
            --cap ${{ github.event.inputs.cap || 600 }} \
            $EXTRA
      - name: Decision diagnostics
        run: node tests/real/real-decision-diagnostics.mjs --reps ${{ github.event.inputs.reps || 10 }} --cap 400
      - name: Build release report
        run: node tests/analysis/release-report.mjs --docs
      - name: Upload reports
        uses: actions/upload-artifact@v7
        with:
          name: release-diagnostics
          path: logs/release-*/
